name: Deploy Lavandería to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verificar versiones
        run: |
          node --version
          pnpm --version

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar aplicación de lavandería
        env:
          BASE_PATH: /
          BASE_URL: /
          VITE_API_URL: https://api-server-latest-0wlb.onrender.com
          VITE_LOGIN_PATH: /simple-jwt-login/v1/auth
          VITE_REMOTE_PATH: ${{ secrets.VITE_REMOTE_PATH }}
        run: pnpm --dir artifacts/lavanderia build

      - name: Crear archivo .htaccess para React/Vite
        run: |
          cat > artifacts/lavanderia/dist/public/.htaccess <<'EOF'
          RewriteEngine On

          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^ index.html [L]
          EOF

      - name: Subir archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: artifacts/lavanderia/dist/public/
          server-dir: /laundry.dbasure.com/